#cloud-config
# OpenClaw + Private Connect Cloud-Init Script
#
# Use this as user-data when creating VMs on:
# - AWS EC2
# - DigitalOcean Droplets
# - Vultr
# - Linode
# - Hetzner Cloud
# - exe.dev
# - Mac Mini (with cloud-init)
# - Any cloud provider supporting cloud-init
#
# Replace YOUR_API_KEY_HERE with your Private Connect API key from:
# https://privateconnect.co/settings/api-keys

package_update: true
package_upgrade: true

packages:
  - curl
  - nginx
  - jq

write_files:
  # nginx config for OpenClaw WebSocket proxy
  - path: /etc/nginx/sites-available/openclaw
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          
          location / {
              proxy_pass http://127.0.0.1:18789;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 86400;
              proxy_send_timeout 86400;
          }
      }

  # Private Connect API key
  - path: /root/.config/privateconnect/api-key
    content: |
      YOUR_API_KEY_HERE
    permissions: '0600'

  # Setup script
  - path: /root/setup-openclaw.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e
      
      echo "=== Setting up OpenClaw + Private Connect ==="
      
      # Enable nginx config
      ln -sf /etc/nginx/sites-available/openclaw /etc/nginx/sites-enabled/default
      systemctl restart nginx
      echo "✓ nginx configured"
      
      # Install OpenClaw
      # curl -fsSL https://openclaw.ai/install.sh | bash -s -- --non-interactive
      echo "⚠ Install OpenClaw manually: https://openclaw.ai"
      
      # Install Private Connect
      curl -fsSL https://privateconnect.co/install.sh | bash -s -- \
        --non-interactive \
        --daemon
      echo "✓ Private Connect installed"
      
      # Wait for OpenClaw gateway to be ready, then expose
      echo "Waiting for OpenClaw gateway..."
      for i in {1..30}; do
        if nc -z localhost 18789 2>/dev/null; then
          connect expose localhost:18789 --name openclaw
          echo "✓ OpenClaw gateway exposed as 'openclaw'"
          break
        fi
        sleep 2
      done
      
      echo ""
      echo "=== Setup Complete ==="
      echo "From any device, run: connect reach openclaw"

runcmd:
  - /root/setup-openclaw.sh

final_message: |
  OpenClaw + Private Connect setup complete!
  
  From your phone/laptop:
    curl -fsSL https://privateconnect.co/install.sh | bash
    connect up
    connect reach openclaw
