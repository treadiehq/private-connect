name: 'Private Connect Tunnel'
description: 'Create a secure tunnel to expose a local service from CI. Optionally post a preview URL as a PR comment.'

inputs:
  api-key:
    description: 'PrivateConnect workspace API key'
    required: true
  port:
    description: 'Local port to expose'
    required: true
  name:
    description: 'Service name (e.g., "preview-app")'
    required: false
    default: ''
  protocol:
    description: 'Protocol: http, tcp, or udp'
    required: false
    default: 'http'
  public:
    description: 'Make the tunnel publicly accessible via URL'
    required: false
    default: 'true'
  ttl:
    description: 'Tunnel time-to-live (e.g., 30m, 1h, 2h)'
    required: false
    default: '1h'
  hub-url:
    description: 'Hub URL (for self-hosted deployments)'
    required: false
    default: 'https://api.privateconnect.co'
  comment-on-pr:
    description: 'Post a comment with the preview URL on the pull request'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token for posting PR comments (defaults to github.token)'
    required: false
    default: ${{ github.token }}

outputs:
  url:
    description: 'Public URL for the tunnel'
    value: ${{ steps.tunnel.outputs.url }}
  subdomain:
    description: 'Tunnel subdomain'
    value: ${{ steps.tunnel.outputs.subdomain }}
  tunnel-id:
    description: 'Tunnel ID for cleanup'
    value: ${{ steps.tunnel.outputs.tunnel_id }}

runs:
  using: 'composite'
  steps:
    - name: Install Private Connect CLI
      shell: bash
      run: |
        npm install -g private-connect@latest 2>/dev/null || npx --yes private-connect --version

    - name: Create tunnel
      id: tunnel
      shell: bash
      env:
        CONNECT_HUB_URL: ${{ inputs.hub-url }}
        PRIVATECONNECT_API_KEY: ${{ inputs.api-key }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_PROTOCOL: ${{ inputs.protocol }}
        INPUT_TTL: ${{ inputs.ttl }}
      run: |
        # Validate port is numeric
        if ! [[ "$INPUT_PORT" =~ ^[0-9]+$ ]]; then
          echo "::error::Port must be a number"
          exit 1
        fi
        ARGS="$INPUT_PORT"

        # Validate name is alphanumeric/dash only
        if [ -n "$INPUT_NAME" ]; then
          if ! [[ "$INPUT_NAME" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Name must be alphanumeric, dashes, or underscores only"
            exit 1
          fi
          ARGS="$ARGS --slug $INPUT_NAME"
        fi

        case "$INPUT_PROTOCOL" in
          tcp)  ARGS="$ARGS --tcp" ;;
          udp)  ARGS="$ARGS --udp" ;;
          http) ;;
          *)    echo "::error::Protocol must be http, tcp, or udp"; exit 1 ;;
        esac

        # Validate TTL format (e.g. 30m, 1h, 2h)
        if ! [[ "$INPUT_TTL" =~ ^[0-9]+[mh]$ ]]; then
          echo "::error::TTL must be in format like 30m or 1h"
          exit 1
        fi
        TTL_MINUTES=$(echo "$INPUT_TTL" | sed -E 's/^([0-9]+)m$/\1/; s/^([0-9]+)h$/\1*60/' | bc)
        ARGS="$ARGS --ttl $TTL_MINUTES"

        OUTPUT=$(npx private-connect tunnel $ARGS 2>&1)
        echo "$OUTPUT"

        URL=$(echo "$OUTPUT" | grep -oE 'https?://[^ ]+' | head -1)
        SUBDOMAIN=$(echo "$URL" | sed -E 's|.*/w/([^/]+).*|\1|')
        TUNNEL_ID=$(echo "$OUTPUT" | grep -oE '[a-f0-9-]{36}' | head -1)

        echo "url=$URL" >> "$GITHUB_OUTPUT"
        echo "subdomain=$SUBDOMAIN" >> "$GITHUB_OUTPUT"
        echo "tunnel_id=$TUNNEL_ID" >> "$GITHUB_OUTPUT"

        if [ -z "$URL" ]; then
          echo "::error::Failed to parse tunnel URL from output"
          exit 1
        fi

        echo "::notice::Tunnel created: $URL"

    - name: Comment on PR
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TUNNEL_URL: ${{ steps.tunnel.outputs.url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        INPUT_TTL: ${{ inputs.ttl }}
        GH_REPO: ${{ github.repository }}
      run: |
        COMMENT_MARKER="<!-- private-connect-preview -->"
        BODY="${COMMENT_MARKER}
        **Preview** ${TUNNEL_URL}

        Tunnel expires in \`${INPUT_TTL}\`. Created by [Private Connect](https://privateconnect.co)."

        EXISTING=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
          --jq ".[] | select(.body | contains(\"${COMMENT_MARKER}\")) | .id" 2>/dev/null | head -1)

        if [ -n "$EXISTING" ]; then
          gh api "repos/${GH_REPO}/issues/comments/${EXISTING}" \
            -X PATCH -f body="$BODY"
        else
          gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            -f body="$BODY"
        fi
