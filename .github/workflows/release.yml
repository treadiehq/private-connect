name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: connect-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: connect-linux-arm64
          - os: macos-latest
            target: bun-darwin-x64
            artifact: connect-darwin-x64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: connect-darwin-arm64

    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd apps/agent
          bun install

      # macOS: Bun can embed a truncated LC_CODE_SIGNATURE; the kernel then SIGKILLs the binary
      # before it runs. Skip Bun's built-in sign, then ad-hoc sign so the binary is valid and runnable.
      - name: Build binary
        run: |
          cd apps/agent
          if echo "${{ matrix.target }}" | grep -q darwin; then
            export BUN_NO_CODESIGN_MACHO_BINARY=1
          fi
          bun build src/cli.ts --compile --target=${{ matrix.target }} --outfile=${{ matrix.artifact }}

      - name: Ad-hoc sign macOS binary
        if: contains(matrix.target, 'darwin')
        run: |
          cd apps/agent
          codesign --force --sign - "${{ matrix.artifact }}"
          codesign --verify --strict "${{ matrix.artifact }}"

      - name: Smoke test binary
        run: |
          cd apps/agent
          chmod +x "${{ matrix.artifact }}"
          BIN="${{ matrix.artifact }}"
          M="$(uname -m)"
          S="$(uname -s)"

          if [[ "$S" == "Linux" ]]; then
            if [[ "$M" == "x86_64" && "$BIN" == *linux-x64 ]]; then
              "./$BIN" --version || exit 1
            elif [[ "$M" == "aarch64" && "$BIN" == *linux-arm64 ]]; then
              "./$BIN" --version || exit 1
            else
              # Cross-compiled (e.g. arm64 ELF on x86_64 runner) — exec returns 126; use file(1) only.
              file "$BIN"
            fi
          elif [[ "$S" == "Darwin" ]]; then
            if [[ "$M" == "arm64" && "$BIN" == *darwin-arm64 ]]; then
              "./$BIN" --version || exit 1
            elif [[ "$M" == "x86_64" && "$BIN" == *darwin-x64 ]]; then
              "./$BIN" --version || exit 1
            elif [[ "$M" == "arm64" && "$BIN" == *darwin-x64 ]]; then
              if ! arch -x86_64 "./$BIN" --version 2>/dev/null; then
                file "$BIN"
                echo "Note: skipped x64 run on arm64 (Rosetta); format checked with file(1) only."
              fi
            else
              file "$BIN"
            fi
          else
            "./$BIN" --version || { file "$BIN"; exit 0; }
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/agent/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -la release/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

